name: marketpos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-marketpos}
      POSTGRES_USER: ${PGUSER:-marketpos}
      POSTGRES_PASSWORD: ${PGPASSWORD:-marketpos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-marketpos} -d ${PGDATABASE:-marketpos}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-marketpos}
      PGUSER: ${PGUSER:-marketpos}
      PGPASSWORD: ${PGPASSWORD:-marketpos}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TTL_DAYS: "30"
      FILES_DIR: /data/files
    volumes:
      - appfiles:/data/files
    networks: [backend]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [backend]

volumes:
  pgdata:
  appfiles:

networks:
  backend:
